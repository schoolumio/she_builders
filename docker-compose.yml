# Local staging-like stack: PostgreSQL + the production image.
# Usage: cp .env.example .env.staging (fill values) && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prayer
      POSTGRES_PASSWORD: prayer
      POSTGRES_DB: prayer
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prayer"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql://prayer:prayer@db:5432/prayer?schema=public
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
